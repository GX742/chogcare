name: Security and recovery checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:source
      - name: Run tests as a disposable non-administrator
        shell: pwsh
        run: ./scripts/ci-tests-unprivileged.ps1
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: npm audit --prefix ops/payments --audit-level=low
      - run: npm audit --prefix admin --audit-level=low
