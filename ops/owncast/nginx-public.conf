# Owncast's host MIME database can identify .ts as a Qt translation file.
# Safari's native HLS needs the actual media type, independent of that database.
map $uri $chogcare_hls_content_type {
    default "";
    ~^/hls/.*\.m3u8$ application/vnd.apple.mpegurl;
    ~^/hls/.*\.ts$ video/mp2t;
    ~^/hls/.*\.jpg$ image/jpeg;
    ~^/hls/.*\.(m4s|mp4)$ video/mp4;
    ~^/hls/ $upstream_http_content_type;
}

# Public media has the same read-only CORS policy for both renditions.
# Empty values omit this header entirely from the payment and rejected routes.
map $uri $chogcare_hls_cors {
    default "";
    ~^/hls/ "*";
}

server {
    # Tailscale Funnel runs on this machine, so the public proxy never needs
    # to accept LAN, tailnet, or Internet connections directly.
    listen 127.0.0.1:8090;
    server_name _;
    server_tokens off;
    access_log off;
    # These apply to rejected paths as well as the narrow media/API routes.
    # This origin serves data only, never an executable Owncast interface.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Type $chogcare_hls_content_type always;
    add_header Access-Control-Allow-Origin $chogcare_hls_cors always;

    # Offer the mobile rendition first. Keep Owncast's original metadata for
    # the high-quality rendition so automatic quality selection still works.
    location = /hls/stream.m3u8 {
        limit_except GET { deny all; }
        proxy_hide_header Content-Type;
        proxy_hide_header Access-Control-Allow-Origin;
        default_type "";
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_hide_header Server;
        # The exact master route is already fixed, and the upstream type is
        # suppressed above; filtering must not depend on that hidden header.
        sub_filter_types *;
        sub_filter_once on;
        sub_filter '#EXT-X-STREAM-INF:' '#EXT-X-STREAM-INF:BANDWIDTH=1500000,AVERAGE-BANDWIDTH=1200000,RESOLUTION=720x1280,FRAME-RATE=15.000,CODECS="avc1.4d401f"\nmobile/stream.m3u8\n#EXT-X-STREAM-INF:';
    }

    # A fresh camera frame fills the initial video buffer delay. This path
    # exposes only the finished JPEG, never encoder temporary files.
    location = /hls/mobile/preview.jpg {
        limit_except GET { deny all; }
        alias /var/lib/chogcare-preview/preview.jpg;
        types { }
        default_type "";
        disable_symlinks on;
    }

    # Only finished public media files are served from the isolated encoder.
    # Temporary files, directory listings and symlinks are never public.
    location ^~ /hls/mobile/ {
        if ($uri !~ "^/hls/mobile/(stream\\.m3u8|stream-[0-9]+\\.ts)$") { return 404; }
        limit_except GET { deny all; }
        alias /var/lib/chogcare-mobile/;
        types { }
        default_type "";
        autoindex off;
        disable_symlinks on;
    }

    # ChogCare consumes HLS directly.  Do not publish the Owncast UI, admin
    # API, chat/websocket endpoints, metrics, or general public API.
    location ^~ /hls/ {
        limit_except GET { deny all; }
        # Suppress the upstream type and nginx's default so only the mapped
        # Content-Type above is emitted. All security headers stay inherited.
        proxy_hide_header Content-Type;
        proxy_hide_header Access-Control-Allow-Origin;
        default_type "";
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_hide_header Server;
    }

    # Vercel proxies same-origin checkout requests to this narrow endpoint.
    # The payment service still validates the exact browser Origin, request
    # shape, idempotency key, session limits and runtime worker readiness.
    location ^~ /api/payments/ {
        limit_except GET POST { deny all; }
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host chogcare.xyz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
        proxy_hide_header Server;
    }

    location / { return 404; }
}
