name: Security and recovery checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  broadcast:
    name: Broadcast recovery and nginx boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Install local nginx fixture runtime
        run: sudo apt-get update && sudo apt-get install -y nginx openssl ffmpeg
      - run: python3 -B test/mobile-input.test.py
      - run: python3 -B test/broadcast-health.test.py
      - run: node --test test/public-relay.test.mjs test/resilient-relay.test.mjs
      - name: Check bounded ingress recovery and Linux persistence
        run: node --test test/ingress-watchdog.test.mjs test/ingress-watchdog-runtime.test.mjs
      - name: Install checksum-verified isolated stream fixture
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 \
            https://github.com/bluenviron/mediamtx/releases/download/v1.21.3/mediamtx_v1.21.3_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mediamtx.tar.gz"
          echo "0a2ea7eba96023631efa1bea7804823a9145b043b6646a8a05798d4ac24ed635  $RUNNER_TEMP/mediamtx.tar.gz" | sha256sum --check
          mkdir -p work/server-owned-delivery/mediamtx-v1.21.3
          tar -xzf "$RUNNER_TEMP/mediamtx.tar.gz" -C work/server-owned-delivery/mediamtx-v1.21.3 mediamtx
      - name: Verify real server video and separate-user station access
        run: CHOGCARE_STREAM_INTEGRATION=1 node --test test/server-stream.test.mjs test/server-stream-integration.test.mjs test/payment-host-readiness.test.mjs
  secrets:
    name: Secret scan of complete Git history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned, checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/chogcare-gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/chogcare-gitleaks" gitleaks
      - name: Verify scanner rejects an in-memory canary
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import secrets; print("GITHUB_TOKEN=ghp_" + secrets.token_hex(18))' | \
            "$RUNNER_TEMP/chogcare-gitleaks/gitleaks" stdin --config .gitleaks.toml --redact=100 --no-banner --exit-code=10; then
            echo 'Secret scanner failed its positive control.'
            exit 1
          else
            test "$?" -eq 10
          fi
      - name: Scan every fetched revision without exposing matched values
        shell: bash
        run: |
          "$RUNNER_TEMP/chogcare-gitleaks/gitleaks" git --log-opts="--all" \
            --config .gitleaks.toml --ignore-gitleaks-allow --redact=100 --no-banner --timeout=120
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:source
      - name: Check bounded live input playlist
        run: python -B test/mobile-input.test.py
      - name: Check source-aware broadcast recovery
        run: python -B test/broadcast-health.test.py
      - name: Run tests as a disposable non-administrator
        shell: pwsh
        run: ./scripts/ci-tests-unprivileged.ps1
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: npm audit --prefix ops/payments --audit-level=low
      - run: npm audit --prefix admin --audit-level=low
