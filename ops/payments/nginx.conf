# Inside nginx's http context. TLS certificate provisioning is done on the VPS.
limit_req_zone $binary_remote_addr zone=chogcare_api:10m rate=15r/s;
server {
    listen 443 ssl;
    server_name api.chogcare.xyz;
    ssl_certificate /etc/letsencrypt/live/api.chogcare.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chogcare.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 8k;
    client_body_timeout 8s;
    access_log off;

    location ^~ /api/payments/ {
        limit_req zone=chogcare_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4174;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4174;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header X-Powered-By;
    }
    location / { return 404; }
}
