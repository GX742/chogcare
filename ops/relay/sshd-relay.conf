# VPS only: include this file at the END of sshd_config, after global directives.
# Match blocks continue across Include files. Run sshd -t before reloading sshd.
# Install the dedicated public key privately; no shell or subsystem is permitted.
Match User chogcare-relay
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowAgentForwarding no
    AllowTcpForwarding remote
    AllowStreamLocalForwarding no
    GatewayPorts no
    PermitListen 127.0.0.1:18090
    PermitOpen none
    PermitTTY no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    ClientAliveInterval 15
    ClientAliveCountMax 3
    IPQoS none
    MaxSessions 0
Match all
