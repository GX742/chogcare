server {
    # Tailscale Funnel runs on this machine, so the public proxy never needs
    # to accept LAN, tailnet, or Internet connections directly.
    listen 127.0.0.1:8090;
    server_name _;
    server_tokens off;
    access_log off;

    # ChogCare consumes HLS directly.  Do not publish the Owncast UI, admin
    # API, chat/websocket endpoints, metrics, or general public API.
    location ^~ /hls/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_hide_header Server;
        add_header X-Content-Type-Options nosniff always;
    }

    location / { return 404; }
}
